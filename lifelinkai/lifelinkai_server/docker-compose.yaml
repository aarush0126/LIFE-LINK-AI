services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lifelinkai
      POSTGRES_PASSWORD: "Xp0KjGj650BqG8fowCuw-pHvIYU1ZobE"
    volumes:
      - lifelinkai_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "X53DQqrT7481dWlUy17bcIsvIQ4QX4Ht"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lifelinkai_test
      POSTGRES_PASSWORD: "WMLY9BK_T98ETB_3PHIvY0PK3sBpDw5i"
    volumes:
      - lifelinkai_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "RW9_pXWHfBRNWToNVfx6JUa37iA6feO_"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  lifelinkai_data:
  lifelinkai_test_data:
